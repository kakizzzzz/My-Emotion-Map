name: Apply profile name test fix

on:
  push:
    branches:
      - agent/fix-profile-name-account-equality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch stale profile-name assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/components/coreFlows.test.tsx')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "expect(screen.getByRole('heading', { name: '用户student_01' })).toBeInTheDocument();":
                  "expect(screen.getByRole('heading', { name: 'student_01' })).toBeInTheDocument();",
              "expect(profileNameInput).toHaveValue('用户student_01');":
                  "expect(profileNameInput).toHaveValue('student_01');",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/apply-profile-name-test-fix.yml

      - name: Commit the regression expectation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/components/coreFlows.test.tsx .github/workflows/apply-profile-name-test-fix.yml
          git commit -m 'update profile name regression expectations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
