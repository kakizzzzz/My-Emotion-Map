name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate mechanical settings split artifact
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source_path = Path('src/styles/settings.css')
          imports_path = Path('src/styles.css')
          output_root = Path('generated-split')
          marker = '.ai-user-prompt-card {'
          generated_header = '/* AI, MCP, and export settings */\n\n'

          source = source_path.read_text(encoding='utf-8')
          if source.count(marker) != 1:
              raise SystemExit(f'expected one split marker, found {source.count(marker)}')

          base, ai_tail = source.split(marker, 1)
          ai = generated_header + marker + ai_tail

          imports = imports_path.read_text(encoding='utf-8')
          import_line = "@import './styles/settings.css';"
          replacement = import_line + "\n@import './styles/settings-ai.css';"
          if imports.count(import_line) != 1:
              raise SystemExit('settings import is missing or duplicated')
          imports = imports.replace(import_line, replacement, 1)

          files = {
              output_root / 'src/styles/settings.css': base,
              output_root / 'src/styles/settings-ai.css': ai,
              output_root / 'src/styles.css': imports,
              output_root / 'scripts/source-size-exceptions.json': '{}\n',
          }
          for path, content in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          reconstructed = base + ai.removeprefix(generated_header)
          if reconstructed != source:
              raise SystemExit('split files do not reconstruct the original stylesheet')

          manifest = '\n'.join([
              f'original_sha256={sha256(source.encode()).hexdigest()}',
              f'reconstructed_sha256={sha256(reconstructed.encode()).hexdigest()}',
              f'original_lines={len(source.splitlines())}',
              f'base_lines={len(base.splitlines())}',
              f'ai_lines={len(ai.splitlines())}',
          ]) + '\n'
          (output_root / 'manifest.txt').write_text(manifest, encoding='utf-8')
          print(manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: split-settings-source
          path: generated-split
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://uifgpmmlvmfrauzbbrem.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-public-placeholder
