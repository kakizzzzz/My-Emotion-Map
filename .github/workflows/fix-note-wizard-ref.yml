name: Fix note wizard callback ref

on:
  push:
    branches:
      - agent/note-wizard-swipe-wheel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Move callback ref update into effect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/notes/useNoteWizardGestures.ts')
          source = path.read_text(encoding='utf-8')
          old = "  const wheelResetTimerRef = useRef<number | null>(null);\n  navigateRef.current = onNavigate;\n\n  useEffect(() => () => {"
          new = "  const wheelResetTimerRef = useRef<number | null>(null);\n\n  useEffect(() => {\n    navigateRef.current = onNavigate;\n  }, [onNavigate]);\n\n  useEffect(() => () => {"
          if source.count(old) != 1:
              raise SystemExit(f'Expected one callback ref block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-note-wizard-ref.yml
      - name: Commit callback ref fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/notes/useNoteWizardGestures.ts .github/workflows/fix-note-wizard-ref.yml
          git commit -m 'fix gesture callback ref update'
          git push origin "HEAD:${GITHUB_REF_NAME}"
