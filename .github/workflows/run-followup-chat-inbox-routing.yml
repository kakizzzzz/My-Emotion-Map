name: run follow-up chat inbox routing fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/followup-chat-inbox-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply routing fix
        run: |
          python scripts/apply-followup-chat-inbox-routing.py
          python scripts/fix-followup-routing-tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify complete application
        run: npm run check:all
        env:
          VITE_SUPABASE_URL: https://uifgpmmlvmfrauzbbrem.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-public-placeholder
      - name: Commit verified routing changes
        run: |
          rm .github/workflows/run-followup-chat-inbox-routing.yml
          rm scripts/apply-followup-chat-inbox-routing.py
          rm scripts/fix-followup-routing-tests.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests .github/workflows/run-followup-chat-inbox-routing.yml scripts/apply-followup-chat-inbox-routing.py scripts/fix-followup-routing-tests.py
          git commit -m "Restore separate follow-up chat and inbox routing"
          git push origin HEAD:${{ github.head_ref }}
