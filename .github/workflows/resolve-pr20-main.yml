name: Resolve PR 20 against main

on:
  push:
    branches:
      - agent/note-wizard-swipe-wheel

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.head_commit.message == 'Resolve PR 20 against main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/note-wizard-swipe-wheel
          fetch-depth: 0

      - name: Merge main and preserve both fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git merge --no-commit --no-ff origin/main || true

          if git diff --name-only --diff-filter=U | grep -q .; then
            git checkout --ours -- tests/components/coreFlows.test.tsx tests/e2e/ui-flows.spec.ts
            git add tests/components/coreFlows.test.tsx tests/e2e/ui-flows.spec.ts
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$unresolved"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/components/coreFlows.test.tsx'): [
                  ("name: '用户student_01'", "name: 'student_01'"),
                  ("toHaveValue('用户student_01')", "toHaveValue('student_01')"),
              ],
              Path('tests/e2e/ui-flows.spec.ts'): [
                  ("'用户e2e_student'", "'e2e_student'"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/resolve-pr20-main.yml
          git add -A
          git commit -m "Merge main into PR 20 and preserve profile fixes"
          git push origin HEAD:agent/note-wizard-swipe-wheel
