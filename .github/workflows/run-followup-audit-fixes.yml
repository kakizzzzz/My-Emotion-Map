name: run follow-up audit fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/audit-followup-ai-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply audited fixes
        run: |
          python scripts/apply-followup-audit-fixes.py
          python scripts/apply-followup-audit-extra.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check:all
      - name: Commit verified source changes
        run: |
          rm .github/workflows/run-followup-audit-fixes.yml
          rm scripts/apply-followup-audit-fixes.py
          rm scripts/apply-followup-audit-extra.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests .github/workflows/run-followup-audit-fixes.yml scripts/apply-followup-audit-fixes.py scripts/apply-followup-audit-extra.py
          git commit -m "Fix follow-up scheduling and revisit targeting"
          git push origin HEAD:${{ github.head_ref }}
