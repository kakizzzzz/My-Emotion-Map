name: Apply profile name e2e input expectation fix

on:
  push:
    branches:
      - agent/fix-profile-name-account-equality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch stale e2e profile-name input assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/ui-flows.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = "  await expect(page.getByRole('textbox', { name: '用户姓名' })).toHaveValue(\n    '用户e2e_student',\n  );"
          new = "  await expect(page.getByRole('textbox', { name: '用户姓名' })).toHaveValue(\n    'e2e_student',\n  );"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/apply-profile-name-e2e-input-fix.yml

      - name: Commit the e2e input expectation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/ui-flows.spec.ts .github/workflows/apply-profile-name-e2e-input-fix.yml
          git commit -m 'update profile name e2e input expectation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
