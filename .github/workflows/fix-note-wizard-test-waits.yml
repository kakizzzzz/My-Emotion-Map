name: Fix note wizard test waits

on:
  push:
    branches:
      - agent/note-wizard-swipe-wheel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Wait for the automatic second page before interacting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/components/coreFlows.test.tsx')
          source = path.read_text(encoding='utf-8')
          old = (
              "    await user.click(screen.getByRole('button', { name: '平静' }));\n"
              "    await user.click(await screen.findByTitle('很安心'));"
          )
          new = (
              "    await user.click(screen.getByRole('button', { name: '平静' }));\n"
              "    await screen.findByRole('heading', {\n"
              "      name: '这个地方给你的感觉',\n"
              "    });\n"
              "    await user.click(screen.getByTitle('很安心'));"
          )
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected two editor timing blocks, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-note-wizard-test-waits.yml
      - name: Commit test timing fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/components/coreFlows.test.tsx .github/workflows/fix-note-wizard-test-waits.yml
          git commit -m 'wait for note wizard auto advance in tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
