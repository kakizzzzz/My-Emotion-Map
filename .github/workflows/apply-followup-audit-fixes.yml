name: apply follow-up audit fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/audit-followup-ai-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply audited follow-up fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          Path('src/app/useFollowUpScheduler.ts').write_text("""import {
            useCallback,
            useEffect,
            useReducer,
            type Dispatch,
            type SetStateAction,
          } from 'react';
          import type { FollowUpRecord } from '../types';
          import { promoteNextDueFollowUp } from '../domain/followUps';

          const MAX_TIMEOUT_MS = 2_147_000_000;

          const hasSameRecords = (
            left: FollowUpRecord[],
            right: FollowUpRecord[],
          ) => left.length === right.length &&
            left.every((record, index) => record === right[index]);

          export function useFollowUpScheduler(
            followUps: FollowUpRecord[],
            setFollowUps: Dispatch<SetStateAction<FollowUpRecord[]>>,
          ) {
            const [, reschedule] = useReducer((value: number) => value + 1, 0);
            const reconcile = useCallback(() => {
              setFollowUps((current) => {
                const promoted = promoteNextDueFollowUp(current);
                return hasSameRecords(current, promoted) ? current : promoted;
              });
            }, [setFollowUps]);

            useEffect(() => {
              reconcile();
              const normalized = promoteNextDueFollowUp(followUps);
              if (normalized.some((record) => record.status === 'active')) return;

              const nextQueued = normalized
                .filter((record) => record.status === 'queued')
                .sort(
                  (left, right) =>
                    new Date(left.dueAt).getTime() - new Date(right.dueAt).getTime(),
                )[0];
              if (!nextQueued) return;

              const dueTime = new Date(nextQueued.dueAt).getTime();
              if (!Number.isFinite(dueTime)) return;
              const delay = Math.min(
                MAX_TIMEOUT_MS,
                Math.max(0, dueTime - Date.now()),
              );
              const timer = window.setTimeout(() => {
                reconcile();
                // Browser timers cap near 24.85 days. Always schedule the next
                // chunk so long follow-ups and clock rollbacks cannot strand a task.
                reschedule();
              }, delay);
              return () => window.clearTimeout(timer);
            }, [followUps, reconcile, reschedule]);

            useEffect(() => {
              const recheck = () => {
                if (document.visibilityState === 'hidden') return;
                reconcile();
                reschedule();
              };
              window.addEventListener('focus', recheck);
              window.addEventListener('pageshow', recheck);
              document.addEventListener('visibilitychange', recheck);
              return () => {
                window.removeEventListener('focus', recheck);
                window.removeEventListener('pageshow', recheck);
                document.removeEventListener('visibilitychange', recheck);
              };
            }, [reconcile, reschedule]);
          }
          """.replace('          ', ''), encoding='utf-8')

          Path('src/app/noteEditorHandlers.ts').write_text("""import type { Dispatch, SetStateAction } from 'react';
          import type { AppLanguage } from '../i18n';
          import type {
            Conversation,
            EmotionKey,
            EmotionMoment,
            EmotionNote,
            FollowUpRecord,
            PlaceRating,
          } from '../types';
          import {
            createFollowUpForNote,
            normalizeFollowUpCurve,
          } from '../domain/followUps';
          import type { PhotoAssistDelivery, ToastHandler } from './appTypes';

          const DAY_MS = 86_400_000;
          const isPendingFollowUp = (record: FollowUpRecord) =>
            record.status === 'queued' || record.status === 'active';

          const consentCycleKey = (record: FollowUpRecord) => {
            const explicit = record.followUpConsentedAt;
            if (explicit && Number.isFinite(new Date(explicit).getTime())) {
              return explicit;
            }
            const dueTime = new Date(record.dueAt).getTime();
            return Number.isFinite(dueTime)
              ? new Date(dueTime - record.intervalDays * DAY_MS).toISOString()
              : '';
          };

          export const reconcileFollowUpsForNote = ({
            records,
            note,
            language,
            intervals,
            enabled,
            wasEnabled,
            now = new Date(),
          }: {
            records: FollowUpRecord[];
            note: EmotionNote;
            language: AppLanguage;
            intervals: number[];
            enabled: boolean;
            wasEnabled: boolean;
            now?: Date;
          }) => {
            if (!enabled) {
              return records.filter(
                (record) => record.noteId !== note.id || !isPendingFollowUp(record),
              );
            }

            const curve = normalizeFollowUpCurve(intervals);
            const desiredIntervals = new Set(curve);
            const noteRecords = records.filter((record) => record.noteId === note.id);
            const latestExistingCycle = noteRecords
              .map((record) => consentCycleKey(record))
              .filter(Boolean)
              .sort(
                (left, right) =>
                  new Date(right).getTime() - new Date(left).getTime(),
              )[0];
            const cycleKey = wasEnabled && latestExistingCycle
              ? latestExistingCycle
              : now.toISOString();
            const cycleDate = new Date(cycleKey);
            const existingIntervals = new Set(
              noteRecords
                .filter((record) => consentCycleKey(record) === cycleKey)
                .map((record) => record.intervalDays),
            );
            const keptPendingIntervals = new Set<number>();
            const retained = records.filter((record) => {
              if (record.noteId !== note.id) return true;
              if (!isPendingFollowUp(record)) return true;
              if (consentCycleKey(record) !== cycleKey) return false;
              if (!desiredIntervals.has(record.intervalDays)) return false;
              if (keptPendingIntervals.has(record.intervalDays)) return false;
              keptPendingIntervals.add(record.intervalDays);
              return true;
            });
            const additions = curve
              .filter((days) => !existingIntervals.has(days))
              .map((days) =>
                createFollowUpForNote(note, language, days, cycleDate),
              );
            return [...retained, ...additions];
          };

          export function useNoteEditorHandlers({
            language,
            starSavedMessage,
            notes,
            followUps,
            followUpIntervals,
            setMoments,
            setNotes,
            setFollowUps,
            setConversations,
            setEditingMomentId,
            setPhotoAssistByMomentId,
            showToast,
          }: {
            language: AppLanguage;
            starSavedMessage: string;
            notes: EmotionNote[];
            followUps: FollowUpRecord[];
            followUpIntervals: number[];
            setMoments: Dispatch<SetStateAction<EmotionMoment[]>>;
            setNotes: Dispatch<SetStateAction<EmotionNote[]>>;
            setFollowUps: Dispatch<SetStateAction<FollowUpRecord[]>>;
            setConversations: Dispatch<SetStateAction<Conversation[]>>;
            setEditingMomentId: Dispatch<SetStateAction<string | null>>;
            setPhotoAssistByMomentId: Dispatch<SetStateAction<Record<string, PhotoAssistDelivery>>>;
            showToast: ToastHandler;
          }) {
            const closeNoteEditor = (momentId: string) => {
              setEditingMomentId(null);
              setMoments((current) =>
                current.map((moment) =>
                  moment.id === momentId ? { ...moment, isNew: false } : moment,
                ),
              );
              setPhotoAssistByMomentId((current) => {
                if (!(momentId in current)) return current;
                const next = { ...current };
                delete next[momentId];
                return next;
              });
            };

            const saveNote = (
              momentId: string,
              nextNote: EmotionNote,
              emotion: EmotionKey | null,
              rating: PlaceRating | null,
              color?: string,
              place?: string,
            ) => {
              const previousNote = notes.find((note) => note.id === nextNote.id);
              const wasFollowUpEnabled = previousNote?.followUpEnabled === true;
              setMoments((current) =>
                current.map((moment) =>
                  moment.id === momentId
                    ? {
                        ...moment,
                        emotion,
                        intensity: emotion ? Math.max(1, moment.intensity) : 0,
                        placeRating: rating,
                        color,
                        place: place ?? moment.place,
                        isNew: false,
                      }
                    : moment,
                ),
              );
              setNotes((current) =>
                current.some((note) => note.id === nextNote.id)
                  ? current.map((note) => (note.id === nextNote.id ? nextNote : note))
                  : [...current, nextNote],
              );
              const pendingFollowUpIds = new Set(
                followUps
                  .filter(
                    (record) =>
                      record.noteId === nextNote.id && isPendingFollowUp(record),
                  )
                  .map((record) => record.id),
              );
              setFollowUps((current) => reconcileFollowUpsForNote({
                records: current,
                note: nextNote,
                language,
                intervals: followUpIntervals,
                enabled: nextNote.followUpEnabled === true,
                wasEnabled: wasFollowUpEnabled,
              }));
              if (!nextNote.followUpEnabled && pendingFollowUpIds.size) {
                setConversations((current) =>
                  current.map((conversation) => {
                    const messages = conversation.messages.filter(
                      (message) =>
                        !message.followUpId ||
                        !pendingFollowUpIds.has(message.followUpId),
                    );
                    if (messages.length === conversation.messages.length) {
                      return conversation;
                    }
                    return {
                      ...conversation,
                      messages,
                      preview: messages[messages.length - 1]?.body ?? '',
                      unread: messages.length ? conversation.unread : false,
                    };
                  }),
                );
              }
              setEditingMomentId(null);
              setPhotoAssistByMomentId((current) => {
                if (!(momentId in current)) return current;
                const next = { ...current };
                delete next[momentId];
                return next;
              });
              showToast(starSavedMessage);
            };

            return { closeNoteEditor, saveNote };
          }
          """.replace('          ', ''), encoding='utf-8')

          app_path = 'src/App.tsx'
          replace_once(
              app_path,
              """  const [revisitNoteId, setRevisitNoteId] = useState<string | null>(null);
            const [toast, setToast] = useState<ToastNotice | null>(null);
          """.replace('          ', ''),
              """  const [revisitNoteId, setRevisitNoteId] = useState<string | null>(null);
            const [revisitFollowUpId, setRevisitFollowUpId] = useState<string | null>(null);
            const [toast, setToast] = useState<ToastNotice | null>(null);
          """.replace('          ', ''),
          )
          replace_once(
              app_path,
              """  } = useNoteEditorHandlers({
            language,
            starSavedMessage: copy.feedback.starSaved,
            followUps,
          """.replace('          ', ''),
              """  } = useNoteEditorHandlers({
            language,
            starSavedMessage: copy.feedback.starSaved,
            notes,
            followUps,
          """.replace('          ', ''),
          )
          replace_once(
              app_path,
              """  const updateRevisitedEmotion = (noteId: string, emotion: EmotionKey) => {
            const note = notes.find((item) => item.id === noteId);
            if (!note) return;
            const relatedFollowUp = [...followUps]
              .reverse()
              .find(
                (record) =>
                  record.noteId === noteId &&
                  (record.status === 'answered' || record.status === 'skipped'),
              );
            if (relatedFollowUp && relatedFollowUp.responseOptionId !== 'skip') {
              const changeDirection = relatedFollowUp.responseOptionId ?? 'different';
              setRevisits((current) => setRevisitCurrentEmotion(
                current,
                note,
                relatedFollowUp.id,
                emotion,
                changeDirection,
              ));
            }
            setRevisitNoteId(null);
            showToast(copy.feedback.feelingSaved);
          };
          """.replace('          ', ''),
              """  const updateRevisitedEmotion = (noteId: string, emotion: EmotionKey) => {
            const note = notes.find((item) => item.id === noteId);
            if (!note) return;
            const targetedFollowUp = revisitFollowUpId
              ? followUps.find(
                  (record) =>
                    record.id === revisitFollowUpId &&
                    record.noteId === noteId &&
                    (record.status === 'answered' || record.status === 'skipped'),
                )
              : null;
            const relatedFollowUp = targetedFollowUp ?? [...followUps]
              .reverse()
              .find(
                (record) =>
                  record.noteId === noteId &&
                  (record.status === 'answered' || record.status === 'skipped'),
              );
            if (relatedFollowUp && relatedFollowUp.responseOptionId !== 'skip') {
              const changeDirection = relatedFollowUp.responseOptionId ?? 'different';
              setRevisits((current) => setRevisitCurrentEmotion(
                current,
                note,
                relatedFollowUp.id,
                emotion,
                changeDirection,
              ));
            }
            setRevisitFollowUpId(null);
            setRevisitNoteId(null);
            showToast(copy.feedback.feelingSaved);
          };
          """.replace('          ', ''),
          )
          replace_once(
              app_path,
              "onRevisitEmotion={setRevisitNoteId}",
              """onRevisitEmotion={(noteId, followUpId) => {
                            setRevisitFollowUpId(followUpId);
                            setRevisitNoteId(noteId);
                          }}""",
          )
          replace_once(
              app_path,
              """                    if (kind !== 'skip' && followUp) {
                        window.setTimeout(() => setRevisitNoteId(followUp.noteId), 220);
                      }
          """.replace('          ', ''),
              """                    if (kind !== 'skip' && followUp) {
                        window.setTimeout(() => {
                          setRevisitFollowUpId(followUp.id);
                          setRevisitNoteId(followUp.noteId);
                        }, 220);
                      }
          """.replace('          ', ''),
          )
          replace_once(
              app_path,
              """              onClose={() => setRevisitNoteId(null)}
                    onConfirm={updateRevisitedEmotion}
          """.replace('          ', ''),
              """              onClose={() => {
                      setRevisitFollowUpId(null);
                      setRevisitNoteId(null);
                    }}
                    onConfirm={updateRevisitedEmotion}
          """.replace('          ', ''),
          )

          chat_path = 'src/features/chat/ChatScreen.tsx'
          replace_once(
              chat_path,
              "onRevisitEmotion: (noteId: string) => void;",
              "onRevisitEmotion: (noteId: string, followUpId: string) => void;",
          )
          replace_once(
              chat_path,
              "onClick={() => onRevisitEmotion(followUp.noteId)}",
              "onClick={() => onRevisitEmotion(followUp.noteId, followUp.id)}",
          )

          note_view_path = 'src/features/notes/NoteViewSheet.tsx'
          replace_once(
              note_view_path,
              """import {
            formatFollowUpTimestamp,
          } from '../../domain/followUps';
          """.replace('          ', ''),
              """import {
            formatFollowUpTimestamp,
            getFollowUpPrompt,
          } from '../../domain/followUps';
          """.replace('          ', ''),
          )
          replace_once(
              note_view_path,
              "<p>{record.prompt}</p>",
              "<p>{record.prompt || getFollowUpPrompt(record, note, language)}</p>",
          )

          Path('tests/components/followUpScheduler.test.tsx').write_text("""import { act, renderHook } from '@testing-library/react';
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { useState } from 'react';
          import { useFollowUpScheduler } from '../../src/app/useFollowUpScheduler';
          import type { FollowUpRecord } from '../../src/types';

          const DAY_MS = 86_400_000;
          const makeFollowUp = (
            dueAt: string,
            status: FollowUpRecord['status'] = 'queued',
          ): FollowUpRecord => ({
            id: 'follow-up-test',
            noteId: 'note-test',
            intervalDays: 31,
            dueAt,
            status,
            promptVersion: 2,
            followUpConsentedAt: '2026-08-01T00:00:00.000Z',
          });

          const useHarness = (initial: FollowUpRecord[]) => {
            const [records, setRecords] = useState(initial);
            useFollowUpScheduler(records, setRecords);
            return records;
          };

          afterEach(() => {
            vi.useRealTimers();
          });

          describe('follow-up scheduler', () => {
            it('keeps scheduling past the browser timeout ceiling', () => {
              vi.useFakeTimers();
              vi.setSystemTime(new Date('2026-08-01T00:00:00.000Z'));
              const { result } = renderHook(() => useHarness([
                makeFollowUp('2026-09-01T00:00:00.000Z'),
              ]));

              act(() => vi.advanceTimersByTime(25 * DAY_MS));
              expect(result.current[0].status).toBe('queued');
              act(() => vi.advanceTimersByTime(7 * DAY_MS));
              expect(result.current[0].status).toBe('active');
            });

            it('rechecks when the app regains focus after the clock moves forward', () => {
              vi.useFakeTimers();
              vi.setSystemTime(new Date('2026-08-01T00:00:00.000Z'));
              const { result } = renderHook(() => useHarness([
                makeFollowUp('2026-08-02T00:00:00.000Z'),
              ]));

              vi.setSystemTime(new Date('2026-08-03T00:00:00.000Z'));
              act(() => window.dispatchEvent(new Event('focus')));
              expect(result.current[0].status).toBe('active');
            });

            it('returns a future active task to the queue after a clock rollback', () => {
              vi.useFakeTimers();
              vi.setSystemTime(new Date('2026-08-01T00:00:00.000Z'));
              const { result } = renderHook(() => useHarness([
                makeFollowUp('2026-08-02T00:00:00.000Z', 'active'),
              ]));

              act(() => vi.advanceTimersByTime(0));
              expect(result.current[0].status).toBe('queued');
            });
          });
          """.replace('          ', ''), encoding='utf-8')

          Path('tests/unit/noteEditorFollowUps.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import { reconcileFollowUpsForNote } from '../../src/app/noteEditorHandlers';
          import type { EmotionNote, FollowUpRecord } from '../../src/types';

          const note: EmotionNote = {
            id: 'note-cycle',
            title: '安静角落',
            titleSource: 'user',
            place: '图书馆',
            date: '2026-08-01',
            time: '10:00',
            emotion: 'calm',
            placeRating: 'comfortable',
            answers: [],
            excerpt: '测试记录',
            followUpEnabled: true,
          };
          const consentedAt = '2026-08-01T10:00:00.000Z';
          const record = (
            intervalDays: number,
            status: FollowUpRecord['status'],
          ): FollowUpRecord => ({
            id: `follow-${intervalDays}-${status}`,
            noteId: note.id,
            intervalDays,
            dueAt: new Date(
              new Date(consentedAt).getTime() + intervalDays * 86_400_000,
            ).toISOString(),
            status,
            promptVersion: 2,
            followUpConsentedAt: consentedAt,
            ...(status === 'answered'
              ? {
                  answeredAt: '2026-08-04T10:00:00.000Z',
                  responseOptionId: 'lighter' as const,
                  response: '轻了',
                }
              : {}),
          });

          describe('note follow-up reconciliation', () => {
            it('does not recreate an answered interval when an enabled note is saved again', () => {
              const result = reconcileFollowUpsForNote({
                records: [record(3, 'answered'), record(7, 'queued'), record(14, 'queued')],
                note,
                language: 'zh',
                intervals: [3, 7, 14],
                enabled: true,
                wasEnabled: true,
                now: new Date('2026-08-05T00:00:00.000Z'),
              });
              expect(result.filter((item) => item.intervalDays === 3)).toHaveLength(1);
              expect(result.filter((item) => item.status === 'queued')).toHaveLength(2);
            });

            it('does not restart a completed curve merely because the note is edited', () => {
              const result = reconcileFollowUpsForNote({
                records: [record(3, 'answered'), record(7, 'answered'), record(14, 'answered')],
                note,
                language: 'zh',
                intervals: [3, 7, 14],
                enabled: true,
                wasEnabled: true,
                now: new Date('2026-09-01T00:00:00.000Z'),
              });
              expect(result).toHaveLength(3);
              expect(result.every((item) => item.status === 'answered')).toBe(true);
            });

            it('starts a new consent cycle only after follow-up was turned off and on again', () => {
              const now = new Date('2026-09-01T00:00:00.000Z');
              const result = reconcileFollowUpsForNote({
                records: [record(3, 'answered'), record(7, 'answered'), record(14, 'answered')],
                note,
                language: 'zh',
                intervals: [3, 7, 14],
                enabled: true,
                wasEnabled: false,
                now,
              });
              const queued = result.filter((item) => item.status === 'queued');
              expect(queued.map((item) => item.intervalDays)).toEqual([3, 7, 14]);
              expect(queued.every((item) => item.followUpConsentedAt === now.toISOString())).toBe(true);
            });
          });
          """.replace('          ', ''), encoding='utf-8')

          Path('tests/components/followUpTargeting.test.tsx').write_text("""import { fireEvent, render, screen } from '@testing-library/react';
          import { describe, expect, it, vi } from 'vitest';
          import { AppLanguageContext, getAppCopy } from '../../src/i18n';
          import { ChatScreen } from '../../src/features/chat/ChatScreen';
          import { NoteViewSheet } from '../../src/features/notes/NoteViewSheet';
          import type {
            Conversation,
            EmotionMoment,
            EmotionNote,
            FollowUpRecord,
          } from '../../src/types';

          const languageValue = {
            language: 'zh' as const,
            copy: getAppCopy('zh'),
            locale: 'zh-CN',
            speechLocale: 'zh-CN',
            setLanguage: vi.fn(),
          };
          const renderZh = (node: React.ReactNode) => render(
            <AppLanguageContext.Provider value={languageValue}>
              {node}
            </AppLanguageContext.Provider>,
          );
          const note: EmotionNote = {
            id: 'note-one',
            title: '安静角落',
            titleSource: 'user',
            place: '图书馆',
            date: '2026-08-01',
            time: '10:00',
            emotion: 'calm',
            placeRating: 'comfortable',
            answers: [],
            excerpt: '测试记录',
            followUpEnabled: true,
          };
          const makeFollowUp = (
            id: string,
            intervalDays: number,
            answeredAt: string,
          ): FollowUpRecord => ({
            id,
            noteId: note.id,
            intervalDays,
            dueAt: answeredAt,
            status: 'answered',
            promptVersion: 2,
            followUpConsentedAt: '2026-08-01T00:00:00.000Z',
            responseOptionId: 'lighter',
            response: '轻了',
            answeredAt,
            answeredVia: 'chat',
            assistantReply: '这次回看已经追加保存。',
          });

          describe('follow-up rendering and targeting', () => {
            it('records the current feeling against the exact follow-up reply that was tapped', () => {
              const onRevisitEmotion = vi.fn();
              const oldFollowUp = makeFollowUp(
                'follow-old',
                3,
                '2026-08-04T00:00:00.000Z',
              );
              const newFollowUp = makeFollowUp(
                'follow-new',
                7,
                '2026-08-08T00:00:00.000Z',
              );
              const conversation: Conversation = {
                id: 'thread-revisit',
                title: '交流回访',
                preview: '',
                kind: 'companion',
                messages: [
                  {
                    id: 'reply-old',
                    role: 'assistant',
                    kind: 'followup_reply',
                    body: '',
                    followUpId: oldFollowUp.id,
                  },
                  {
                    id: 'reply-new',
                    role: 'assistant',
                    kind: 'followup_reply',
                    body: '',
                    followUpId: newFollowUp.id,
                  },
                ],
              };
              renderZh(
                <ChatScreen
                  notes={[note]}
                  followUps={[oldFollowUp, newFollowUp]}
                  conversations={[conversation]}
                  activeConversationId={conversation.id}
                  workspaceKey="test-follow-up-target"
                  onAnswerFollowUp={vi.fn()}
                  onRevisitEmotion={onRevisitEmotion}
                  cloudAuth={null}
                  cloudRevision={null}
                  cloudStatus="signed_out"
                  onBeginChat={vi.fn()}
                  onCompleteChat={vi.fn()}
                  onFailChat={vi.fn()}
                  onNewConversation={vi.fn()}
                  onRenameConversation={vi.fn()}
                  onExitToMap={vi.fn()}
                  onToast={vi.fn()}
                />,
              );
              fireEvent.click(
                screen.getAllByRole('button', { name: '记录现在的感受' })[0],
              );
              expect(onRevisitEmotion).toHaveBeenCalledWith(note.id, oldFollowUp.id);
            });

            it('shows the generated v2 follow-up prompt in record history', () => {
              const followUp = makeFollowUp(
                'follow-history',
                3,
                '2026-08-04T00:00:00.000Z',
              );
