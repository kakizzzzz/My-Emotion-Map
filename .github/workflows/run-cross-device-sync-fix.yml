name: run cross-device cloud sync fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/cross-device-cloud-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cross-device sync fix
        run: python scripts/apply-cross-device-sync-fix.py
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify complete application
        run: npm run check:all
        env:
          VITE_SUPABASE_URL: https://uifgpmmlvmfrauzbbrem.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-public-placeholder
      - name: Commit verified changes
        run: |
          git checkout origin/main -- .github/workflows/quality.yml
          rm .github/workflows/run-cross-device-sync-fix.yml
          rm scripts/apply-cross-device-sync-fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests .github/workflows/quality.yml .github/workflows/run-cross-device-sync-fix.yml scripts/apply-cross-device-sync-fix.py
          git commit -m "Fix cross-device cloud sync visibility"
          git push origin HEAD:${{ github.head_ref }}
