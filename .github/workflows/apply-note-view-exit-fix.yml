name: Apply note view exit fix

on:
  push:
    branches:
      - agent/private-note-image-storage

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'trigger note view exit fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disable pointer events during note view exit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/notes/NoteViewSheet.tsx')
          source = path.read_text()
          source = source.replace(
              '      exit={{ opacity: 0 }}\n',
              "      exit={{ opacity: 0, pointerEvents: 'none' }}\n",
              1,
          )
          source = source.replace(
              '        exit={{ y: 26, opacity: 0 }}\n',
              "        exit={{ y: 26, opacity: 0, pointerEvents: 'none' }}\n",
              1,
          )
          path.write_text(source)
          PY
          rm .github/agent/trigger-note-view-exit-fix
          rm .github/workflows/apply-note-view-exit-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unblock map actions while note view exits"
          git push origin HEAD:agent/private-note-image-storage
