name: Apply note image storage patch

on:
  push:
    branches:
      - agent/private-note-image-storage

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage note image storage patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply uploaded patch
        run: |
          base64 -d .github/agent/note-image-storage.patch.gz.b64 | gzip -d > /tmp/note-image-storage.patch
          git apply --index /tmp/note-image-storage.patch
          rm .github/agent/note-image-storage.patch.gz.b64
          rm .github/workflows/apply-note-image-storage.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add private note image storage"
          git push origin HEAD:agent/private-note-image-storage
